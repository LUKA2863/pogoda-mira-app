<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Погода Мира</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--fg:#fff;--muted:rgba(255,255,255,.72);--glass:rgba(255,255,255,.14);--glass-b:rgba(255,255,255,.25);--accent:#ffd36b;
--bg1:#3a7bd5;--bg2:#00d2ff;--r:22px}
body.light-theme{--glass:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--fg);
background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;transition:background 1s;min-height:100vh;overflow-x:hidden}
#bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:float 18s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(40px,60px) scale(1.2)}}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
padding:16px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
h3{margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;position:relative}
.search input{width:100%;padding:12px 14px 12px 38px;border-radius:16px;border:1px solid var(--glass-b);background:var(--glass);color:var(--fg);font-size:16px;outline:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search input::placeholder{color:var(--muted)}
.search:before{content:"🔍";position:absolute;left:12px;top:11px;font-size:15px;opacity:.8}
.sugg{position:absolute;top:50px;left:0;right:0;background:rgba(20,30,50,.92);border-radius:16px;overflow:hidden;z-index:20;display:none;backdrop-filter:blur(14px)}
.sugg div{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.sugg div small{color:var(--muted)}
.btn{border:1px solid var(--glass-b);background:var(--glass);color:var(--fg);border-radius:14px;padding:11px 12px;font-size:15px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.94)}
.btn.on{background:rgba(255,255,255,.35)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hero{text-align:center;padding:22px 16px}
.hero .city{font-size:24px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:8px}
.star{background:none;border:none;font-size:24px;cursor:pointer;color:var(--fg);transition:transform .2s}
.star:active{transform:scale(1.4)}
.hero .temp{font-size:88px;font-weight:200;line-height:1;margin:6px 0;letter-spacing:-3px}
.hero .desc{font-size:18px;color:var(--muted)}
.hero .hl{margin-top:6px;font-size:15px;color:var(--muted)}
.icon-big{width:130px;height:130px;margin:0 auto}
.tip{display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.35}
.tip .e{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.m{background:rgba(255,255,255,.08);border-radius:16px;padding:12px}
.m .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.m .v{font-size:20px;font-weight:600;margin-top:4px}
.m .s{font-size:12px;color:var(--muted);margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.hr{min-width:62px;text-align:center;scroll-snap-align:start;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.07)}
.hr.now{background:rgba(255,255,255,.25)}
.hr .t{font-size:13px;color:var(--muted)}.hr .tv{font-weight:600;font-size:16px}.hr .p{font-size:11px;color:#9fd8ff;min-height:13px}
.hr svg{width:34px;height:34px}
.day{display:grid;grid-template-columns:66px 28px 30px 34px 1fr 34px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.day:last-child{border:none}
.day svg{width:30px;height:30px}.day .p{font-size:11px;color:#9fd8ff;text-align:center}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#6ec6ff,#ffd36b,#ff7b54)}
.tmin{color:var(--muted);text-align:right}.tmax{font-weight:600}
.sun{display:flex;justify-content:space-between;align-items:flex-end}
.sun svg{width:100%;height:80px}
.aqi-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#4cd964,#ffcc00,#ff9500,#ff3b30,#af52de,#7e0023);position:relative;margin:10px 0 4px}
.aqi-bar b{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid rgba(0,0,0,.3);transform:translateX(-50%);transition:left 1s}
.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cities .btn{font-size:13px;padding:10px 6px;white-space:normal;text-align:center}
.cmp{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer}
.cmp:last-child{border:none}.cmp .l{display:flex;align-items:center;gap:10px}.cmp svg{width:36px;height:36px}.cmp .v{font-size:24px;font-weight:300}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav .btn{flex:1;max-width:130px;font-size:13px;border:none;background:none;opacity:.7}
.nav .btn.on{opacity:1;background:rgba(255,255,255,.2)}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.22),rgba(255,255,255,.08));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.err{text-align:center;padding:24px}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:15px}
.view{display:none}.view.on{display:block}
/* icon animations */
.spin{animation:spin 14s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 4s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(6px)}}
.drop{animation:drop 1.1s linear infinite}
@keyframes drop{from{transform:translateY(-4px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.flash{animation:flash 2.5s infinite}
@keyframes flash{0%,88%,100%{opacity:0}90%,94%{opacity:1}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
</style>
</head>
<body>
<div id="bgfx"></div>
<div class="app">
  <div class="top">
    <div class="search"><input id="q" placeholder="Поиск города…" autocomplete="off"><div class="sugg" id="sugg"></div></div>
    <button class="btn" id="geo" title="Моё местоположение">📍</button>
    <button class="btn" id="unit">°C</button>
  </div>

  <div class="view on" id="v-weather"><div id="wx"></div></div>

  <div class="view" id="v-cities">
    <div class="tabs" id="tabs"></div>
    <div class="card"><div class="cities" id="cityGrid"></div></div>
  </div>

  <div class="view" id="v-compare">
    <div class="card"><h3>Сравнение избранных</h3><div id="cmpList"></div></div>
  </div>
</div>
<div class="nav">
  <button class="btn on" data-v="weather">🌤 Погода</button>
  <button class="btn" data-v="cities">🗺 Города</button>
  <button class="btn" data-v="compare">⚖️ Сравнить</button>
</div>

<script>
(function(){
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
if (tg && tg.colorScheme === "light") document.body.classList.add("light-theme");

var $ = function(id){ return document.getElementById(id); };
function haptic(t){ try{ if(tg && tg.HapticFeedback){ if(t==="sel") tg.HapticFeedback.selectionChanged(); else if(t==="ok") tg.HapticFeedback.notificationOccurred("success"); else if(t==="err") tg.HapticFeedback.notificationOccurred("error"); else tg.HapticFeedback.impactOccurred(t||"light"); } }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

/* ---------- storage (CloudStorage -> localStorage) ---------- */
var store = {
  get: function(k){ return new Promise(function(res){
    var ls = localStorage.getItem(k);
    if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
      try { tg.CloudStorage.getItem(k, function(err,v){ res(!err && v ? v : ls); }); return; } catch(e){}
    }
    res(ls);
  });},
  set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){}
    if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) { try{ tg.CloudStorage.setItem(k,v); }catch(e){} } }
};

var state = { unit:"C", favs:[], place:null, data:null, view:"weather", regions:null, region:null };

/* ---------- weather codes ---------- */
var WMO = {0:["Ясно","clear"],1:["Преимущественно ясно","clear"],2:["Переменная облачность","partly"],3:["Пасмурно","cloudy"],
45:["Туман","fog"],48:["Изморозь, туман","fog"],51:["Слабая морось","drizzle"],53:["Морось","drizzle"],55:["Сильная морось","drizzle"],
56:["Ледяная морось","drizzle"],57:["Ледяная морось","drizzle"],61:["Небольшой дождь","rain"],63:["Дождь","rain"],65:["Ливень","rain"],
66:["Ледяной дождь","rain"],67:["Ледяной дождь","rain"],71:["Небольшой снег","snow"],73:["Снег","snow"],75:["Сильный снег","snow"],77:["Снежные зёрна","snow"],
80:["Ливневый дождь","rain"],81:["Ливни","rain"],82:["Сильные ливни","rain"],85:["Снегопад","snow"],86:["Сильный снегопад","snow"],
95:["Гроза","storm"],96:["Гроза с градом","storm"],99:["Сильная гроза с градом","storm"]};
function wmo(c){ return WMO[c] || ["—","cloudy"]; }

var BG = {
  clear:{d:["#2f80ed","#56ccf2"],n:["#0f2027","#2c5364"]},
  partly:{d:["#4b79a1","#7fb3e0"],n:["#141e30","#35577d"]},
  cloudy:{d:["#606c88","#9aa7b8"],n:["#232526","#414345"]},
  fog:{d:["#8e9eab","#c5ced6"],n:["#3a4149","#5b6670"]},
  drizzle:{d:["#4e6e8e","#89a3bd"],n:["#1c2a3a","#3c536b"]},
  rain:{d:["#3a4e6b","#6b86a6"],n:["#0f1a2b","#2b3d55"]},
  snow:{d:["#83a4d4","#d7e6f5"],n:["#2b3a55","#5f7393"]},
  storm:{d:["#283048","#4b5a78"],n:["#0b0f1a","#262d40"]}
};
function setBg(kind, day){
  var c = (BG[kind]||BG.clear)[day?"d":"n"];
  document.documentElement.style.setProperty("--bg1",c[0]);
  document.documentElement.style.setProperty("--bg2",c[1]);
  if (tg){ try{ tg.setHeaderColor(c[0]); tg.setBackgroundColor(c[0]); }catch(e){} }
  var fx = $("bgfx"); fx.innerHTML = "";
  var cols = day ? ["#fff7c2","#ffffff","#bde3ff"] : ["#6a5acd","#1e90ff","#9370db"];
  for (var i=0;i<3;i++){ var b=document.createElement("div"); b.className="blob";
    var s=180+i*60; b.style.cssText="width:"+s+"px;height:"+s+"px;background:"+cols[i]+";left:"+(i*35-10)+"%;top:"+(i*30-5)+"%;animation-delay:-"+(i*5)+"s"; fx.appendChild(b); }
}

/* ---------- SVG icons ---------- */
function sunSvg(){ var r=""; for(var i=0;i<8;i++){ r+='<line x1="32" y1="8" x2="32" y2="14" transform="rotate('+(i*45)+' 32 32)"/>'; }
  return '<g class="spin"><g stroke="#ffd36b" stroke-width="3" stroke-linecap="round">'+r+'</g><circle cx="32" cy="32" r="11" fill="#ffd36b"/></g>'; }
function moonSvg(){ return '<path class="pulse" d="M40 14a18 18 0 1 0 10 30A15 15 0 0 1 40 14z" fill="#f4f1c9"/>'; }
function cloud(fill,x,y){ return '<g class="drift" transform="translate('+(x||0)+' '+(y||0)+')"><path d="M20 46h26a10 10 0 0 0 0-20 14 14 0 0 0-27-2A11 11 0 0 0 20 46z" fill="'+fill+'"/></g>'; }
function icon(code, day){
  var k = wmo(code)[1], s='<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">';
  var body = day ? sunSvg() : moonSvg();
  if (k==="clear") s += body;
  else if (k==="partly") s += '<g transform="translate(-8 -8) scale(.9)">'+body+'</g>'+cloud("#fff",4,6);
  else if (k==="cloudy") s += cloud("#cfd8e3",-6,-4)+cloud("#fff",4,4);
  else if (k==="fog") s += cloud("#e6ebf0",0,-6)+'<g stroke="#e6ebf0" stroke-width="3" stroke-linecap="round" class="drift"><line x1="12" y1="50" x2="52" y2="50"/><line x1="18" y1="57" x2="46" y2="57"/></g>';
  else if (k==="snow") { s += cloud("#fff",0,-6); for(var i=0;i<3;i++) s+='<circle class="drop" style="animation-delay:'+(i*.35)+'s;animation-duration:2s" cx="'+(22+i*10)+'" cy="50" r="2.6" fill="#fff"/>'; }
  else if (k==="rain"||k==="drizzle") { s += cloud("#dfe7f0",0,-6); for(var j=0;j<3;j++) s+='<line class="drop" style="animation-delay:'+(j*.3)+'s" x1="'+(24+j*9)+'" y1="46" x2="'+(21+j*9)+'" y2="54" stroke="#7cc6ff" stroke-width="2.5" stroke-linecap="round"/>'; }
  else if (k==="storm") s += cloud("#b8c2d0",0,-6)+'<path class="flash" d="M34 40l-8 12h7l-4 10 11-14h-7l4-8z" fill="#ffd36b"/>';
  return s+'</svg>';
}

/* ---------- units/format ---------- */
function T(c){ if(c==null||isNaN(c)) return "—"; return Math.round(state.unit==="F" ? c*9/5+32 : c)+"°"; }
var DIRS=["С","СВ","В","ЮВ","Ю","ЮЗ","З","СЗ"];
function dir(d){ return DIRS[Math.round(d/45)%8]; }
function hm(iso){ return iso ? iso.slice(11,16) : "—"; }
var DOW=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
function uvTxt(u){ return u<3?"Низкий":u<6?"Умеренный":u<8?"Высокий":u<11?"Очень высокий":"Экстремальный"; }
function aqiTxt(a){ return a<=20?"Отличный":a<=40?"Хороший":a<=60?"Умеренный":a<=80?"Плохой":a<=100?"Очень плохой":"Опасный"; }

function tip(c, d){
  var t=c.apparent_temperature, k=wmo(c.weather_code)[1], p=d.daily.precipitation_probability_max[0]||0, uv=d.daily.uv_index_max[0]||0, parts=[], e="👕";
  if (t<-15){ e="🧥"; parts.push("Очень холодно: пуховик, термобельё, шапка и варежки"); }
  else if (t<-5){ e="🧥"; parts.push("Зимняя куртка, шапка, шарф и перчатки"); }
  else if (t<5){ e="🧣"; parts.push("Тёплая куртка и шапка"); }
  else if (t<12){ e="🧥"; parts.push("Куртка или пальто, закрытая обувь"); }
  else if (t<18){ e="🧶"; parts.push("Свитер или лёгкая куртка"); }
  else if (t<24){ e="👕"; parts.push("Футболка и лёгкая кофта на вечер"); }
  else { e="🩳"; parts.push("Лёгкая одежда, пейте больше воды"); }
  if (k==="rain"||k==="storm"||k==="drizzle"||p>=50){ e="☔"; parts.push("возьмите зонт"); }
  if (k==="snow") parts.push("непромокаемая обувь");
  if (c.wind_speed_10m>36) parts.push("сильный ветер — капюшон пригодится");
  if (uv>=6 && c.is_day) parts.push("нужны солнцезащитный крем и очки");
  return {e:e, t: parts.join(", ")+"."};
}

/* ---------- API ---------- */
function getJSON(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
function geocode(name, n){ return getJSON("https://geocoding-api.open-meteo.com/v1/search?language=ru&count="+(n||1)+"&name="+encodeURIComponent(name)).then(function(j){ return j.results||[]; }); }
function forecast(p){
  return getJSON("https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,is_day,precipitation"+
    "&hourly=temperature_2m,weather_code,precipitation_probability,is_day,visibility,uv_index"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,daylight_duration"+
    "&timezone=auto&forecast_days=7&wind_speed_unit=kmh");
}
function air(p){ return getJSON("https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+p.lat+"&longitude="+p.lon+"&current=european_aqi,pm2_5,pm10&timezone=auto").catch(function(){ return null; }); }

/* ---------- render ---------- */
function skeleton(){
  $("wx").innerHTML='<div class="card hero"><div class="sk" style="height:26px;width:50%;margin:0 auto"></div><div class="sk" style="height:130px;width:130px;margin:16px auto;border-radius:50%"></div><div class="sk" style="height:80px;width:40%;margin:0 auto"></div></div>'+
   '<div class="card"><div class="sk" style="height:90px"></div></div><div class="card"><div class="sk" style="height:220px"></div></div>';
}
function isFav(p){ return state.favs.some(function(f){ return Math.abs(f.lat-p.lat)<.01 && Math.abs(f.lon-p.lon)<.01; }); }

function render(){
  var d=state.data, p=state.place, c=d.current, aq=state.air;
  var k=wmo(c.weather_code), day=!!c.is_day;
  setBg(k[1], day);
  var nowIdx=0, nowT=c.time.slice(0,13);
  for (var i=0;i<d.hourly.time.length;i++){ if(d.hourly.time[i].slice(0,13)===nowT){ nowIdx=i; break; } }
  var vis=d.hourly.visibility[nowIdx], uvNow=d.hourly.uv_index[nowIdx], pp=d.hourly.precipitation_probability[nowIdx];
  var tp=tip(c,d);
  var h='';
  h+='<div class="card hero"><div class="city">'+esc(p.name)+'<button class="star" id="favBtn">'+(isFav(p)?"★":"☆")+'</button></div>';
  if (p.sub) h+='<div class="hl">'+esc(p.sub)+'</div>';
  h+='<div class="icon-big">'+icon(c.weather_code,day)+'</div><div class="temp">'+T(c.temperature_2m)+'</div><div class="desc">'+k[0]+'</div>'+
     '<div class="hl">Ощущается как '+T(c.apparent_temperature)+' · Макс '+T(d.daily.temperature_2m_max[0])+' Мин '+T(d.daily.temperature_2m_min[0])+'</div></div>';
  h+='<div class="card tip"><div class="e">'+tp.e+'</div><div>'+tp.t+'</div></div>';
  // hourly
  h+='<div class="card"><h3>Прогноз на 24 часа</h3><div class="hscroll">';
  for (var j=nowIdx;j<Math.min(nowIdx+24,d.hourly.time.length);j++){
    var prb=d.hourly.precipitation_probability[j];
    h+='<div class="hr'+(j===nowIdx?" now":"")+'"><div class="t">'+(j===nowIdx?"Сейчас":hm(d.hourly.time[j]))+'</div>'+icon(d.hourly.weather_code[j],d.hourly.is_day[j])+
       '<div class="p">'+(prb>=10?prb+"%":"")+'</div><div class="tv">'+T(d.hourly.temperature_2m[j])+'</div></div>';
  }
  h+='</div></div>';
  // daily
  var mn=Math.min.apply(null,d.daily.temperature_2m_min), mx=Math.max.apply(null,d.daily.temperature_2m_max), rng=(mx-mn)||1;
  h+='<div class="card"><h3>Прогноз на 7 дней</h3>';
  d.daily.time.forEach(function(t,i){
    var dt=new Date(t+"T12:00:00"), lo=d.daily.temperature_2m_min[i], hi=d.daily.temperature_2m_max[i], pr=d.daily.precipitation_probability_max[i];
    h+='<div class="day"><div>'+(i===0?"Сегодня":DOW[dt.getDay()]+" "+dt.getDate())+'</div><div class="p">'+(pr>=20?pr+"%":"")+'</div>'+icon(d.daily.weather_code[i],true)+
       '<div class="tmin">'+T(lo)+'</div><div class="bar"><i style="left:'+((lo-mn)/rng*100)+'%;right:'+((mx-hi)/rng*100)+'%"></i></div><div class="tmax">'+T(hi)+'</div></div>';
  });
  h+='</div>';
  // details
  h+='<div class="card"><h3>Подробности</h3><div class="grid">'+
    m("💧 Влажность", c.relative_humidity_2m+"%", "")+
    m("🌡 Давление", Math.round(c.pressure_msl*0.750062)+" мм", "рт. ст.")+
    m("💨 Ветер", Math.round(c.wind_speed_10m/3.6)+" м/с", dir(c.wind_direction_10m)+' <span style="display:inline-block;transform:rotate('+(c.wind_direction_10m+180)+'deg)">↑</span> · порывы '+Math.round(c.wind_gusts_10m/3.6)+" м/с")+
    m("☀️ УФ-индекс", (uvNow!=null?Math.round(uvNow):"—"), "макс. "+Math.round(d.daily.uv_index_max[0]||0)+" · "+uvTxt(d.daily.uv_index_max[0]||0))+
    m("👁 Видимость", vis!=null?(vis>=1000?Math.round(vis/1000)+" км":Math.round(vis)+" м"):"—", "")+
    m("☔ Осадки", (pp!=null?pp:0)+"%", "вероятность сейчас")+
    '</div></div>';
  // sun
  var sr=d.daily.sunrise[0], ss=d.daily.sunset[0], dl=d.daily.daylight_duration[0]||0;
  var toMin=function(s){ return +s.slice(11,13)*60+ +s.slice(14,16); }, nm=toMin(c.time), a=toMin(sr), b=toMin(ss);
  var f=Math.max(0,Math.min(1,(nm-a)/((b-a)||1))), ang=Math.PI*(1-f), sx=150+130*Math.cos(ang), sy=75-65*Math.sin(ang);
  h+='<div class="card"><h3>Солнце</h3><svg viewBox="0 0 300 85" style="width:100%;height:85px"><path d="M20 75 A130 65 0 0 1 280 75" fill="none" stroke="rgba(255,255,255,.4)" stroke-dasharray="4 5" stroke-width="2"/>'+
     '<line x1="0" y1="75" x2="300" y2="75" stroke="rgba(255,255,255,.3)"/>'+(day?'<circle cx="'+sx.toFixed(1)+'" cy="'+sy.toFixed(1)+'" r="9" fill="#ffd36b"/>':'')+'</svg>'+
     '<div class="sun"><div>🌅 Восход<br><b>'+hm(sr)+'</b></div><div style="text-align:center;color:var(--muted);font-size:13px">Световой день<br>'+Math.floor(dl/3600)+' ч '+Math.round(dl%3600/60)+' мин</div><div style="text-align:right">🌇 Закат<br><b>'+hm(ss)+'</b></div></div></div>';
  // air
  if (aq && aq.current && aq.current.european_aqi!=null){
    var A=aq.current.european_aqi;
    h+='<div class="card"><h3>Качество воздуха</h3><div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:30px;font-weight:600">'+A+' <span style="font-size:16px;font-weight:400">'+aqiTxt(A)+'</span></div><div style="color:var(--muted);font-size:13px">EAQI</div></div>'+
       '<div class="aqi-bar"><b style="left:'+Math.min(100,A)+'%"></b></div><div class="grid" style="margin-top:12px">'+
       m("PM2.5", Math.round(aq.current.pm2_5)+" мкг/м³", "")+m("PM10", Math.round(aq.current.pm10)+" мкг/м³", "")+'</div></div>';
  }
  h+='<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:6px">Данные: Open-Meteo · обновлено '+hm(c.time)+' (местное время)</div>';
  $("wx").innerHTML=h;
  $("favBtn").onclick=toggleFav;
  updateMainButton();
}
function m(k,v,s){ return '<div class="m"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }

function load(p){
  state.place=p; showView("weather"); skeleton(); window.scrollTo({top:0,behavior:"smooth"});
  store.set("last", JSON.stringify(p));
  return Promise.all([forecast(p), air(p)]).then(function(r){ state.data=r[0]; state.air=r[1]; render(); haptic("ok"); })
  .catch(function(e){ haptic("err"); $("wx").innerHTML='<div class="card err">😕 Не удалось загрузить погоду<br><small>'+esc(e.message)+'</small><br><br><button class="btn" id="retry">Повторить</button></div>'; $("retry").onclick=function(){ load(p); }; });
}
function loadByName(name, cc){
  skeleton(); showView("weather");
  return geocode(name, 5).then(function(rs){
    var r = rs.filter(function(x){ return !cc || x.country_code===cc; })[0] || rs[0];
    if (!r) throw new Error("Город не найден");
    return load(place(r));
  }).catch(function(e){ $("wx").innerHTML='<div class="card err">😕 '+esc(e.message)+'</div>'; });
}
function place(r){ return {name:r.name, sub:[r.admin1,r.country].filter(Boolean).join(", "), lat:+r.latitude.toFixed(3), lon:+r.longitude.toFixed(3)}; }

/* ---------- favorites ---------- */
function saveFavs(){ store.set("favs", JSON.stringify(state.favs)); }
function toggleFav(){
  var p=state.place; haptic("medium");
  if (isFav(p)) state.favs=state.favs.filter(function(f){ return !(Math.abs(f.lat-p.lat)<.01 && Math.abs(f.lon-p.lon)<.01); });
  else state.favs.push({name:p.name, sub:p.sub, lat:p.lat, lon:p.lon});
  saveFavs(); $("favBtn").textContent=isFav(p)?"★":"☆"; updateMainButton();
}
function renderCompare(){
  var el=$("cmpList");
  if (!state.favs.length){ el.innerHTML='<div class="empty">Добавьте города в избранное звёздочкой ☆ — и здесь появится их сравнение</div>'; return; }
  el.innerHTML=state.favs.map(function(){ return '<div class="sk" style="height:48px;margin:8px 0"></div>'; }).join("");
  var lats=state.favs.map(function(f){return f.lat;}).join(","), lons=state.favs.map(function(f){return f.lon;}).join(",");
  getJSON("https://api.open-meteo.com/v1/forecast?latitude="+lats+"&longitude="+lons+"&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto")
  .then(function(j){
    var arr=Array.isArray(j)?j:[j];
    var rows=state.favs.map(function(f,i){ return {f:f,c:arr[i].current,d:arr[i].daily,i:i}; }).sort(function(a,b){ return b.c.temperature_2m-a.c.temperature_2m; });
    el.innerHTML=rows.map(function(r){ return '<div class="cmp" data-i="'+r.i+'"><div class="l">'+icon(r.c.weather_code,r.c.is_day)+'<div><div>'+esc(r.f.name)+'</div><small style="color:var(--muted)">'+wmo(r.c.weather_code)[0]+' · '+T(r.d.temperature_2m_min[0])+'…'+T(r.d.temperature_2m_max[0])+'</small></div></div><div class="v">'+T(r.c.temperature_2m)+'</div></div>'; }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".cmp"),function(n){ n.onclick=function(){ haptic("sel"); load(state.favs[+n.dataset.i]); }; });
  }).catch(function(){ el.innerHTML='<div class="empty">Не удалось загрузить данные</div>'; });
}

/* ---------- views / telegram buttons ---------- */
function showView(v){
  state.view=v;
  ["weather","cities","compare"].forEach(function(x){ $("v-"+x).classList.toggle("on",x===v); });
  Array.prototype.forEach.call(document.querySelectorAll(".nav .btn"),function(b){ b.classList.toggle("on",b.dataset.v===v); });
  if (v==="compare") renderCompare();
  if (v==="cities") renderCities();
  if (tg && tg.BackButton){ try{ v==="weather"?tg.BackButton.hide():tg.BackButton.show(); }catch(e){} }
  updateMainButton();
}
function updateMainButton(){
  if (!tg || !tg.MainButton) return;
  try{
    if (state.view==="weather" && state.place && state.data){
      tg.MainButton.setText(isFav(state.place)?"Сравнить избранные":"★ В избранное"); tg.MainButton.show();
    } else tg.MainButton.hide();
  }catch(e){}
}
if (tg){
  try{
    tg.BackButton.onClick(function(){ haptic("light"); showView("weather"); });
    tg.MainButton.onClick(function(){ if(isFav(state.place)) showView("compare"); else toggleFav(); });
  }catch(e){}
}
Array.prototype.forEach.call(document.querySelectorAll(".nav .btn"),function(b){ b.onclick=function(){ haptic("sel"); showView(b.dataset.v); }; });

/* ---------- cities ---------- */
function renderCities(){
  if (!state.regions) return;
  var names=Object.keys(state.regions); if(!state.region) state.region=names[0];
  $("tabs").innerHTML=names.map(function(n){ return '<button class="btn'+(n===state.region?" on":"")+'" data-r="'+esc(n)+'">'+esc(n)+'</button>'; }).join("");
  Array.prototype.forEach.call($("tabs").children,function(b){ b.onclick=function(){ haptic("sel"); state.region=b.dataset.r; renderCities(); }; });
  var list=state.regions[state.region];
  $("cityGrid").innerHTML=list.map(function(c,i){ return '<button class="btn" data-i="'+i+'">'+esc(c[0])+'</button>'; }).join("");
  Array.prototype.forEach.call($("cityGrid").children,function(b){ b.onclick=function(){ haptic("light"); var c=list[+b.dataset.i]; loadByName(c[0],c[1]); }; });
}

/* ---------- search ---------- */
var st;
$("q").addEventListener("input",function(){
  clearTimeout(st); var v=this.value.trim();
  if (v.length<2){ $("sugg").style.display="none"; return; }
  st=setTimeout(function(){
    geocode(v,6).then(function(rs){
      var s=$("sugg");
      if(!rs.length){ s.innerHTML='<div><small>Ничего не найдено</small></div>'; s.style.display="block"; return; }
      s.innerHTML=rs.map(function(r,i){ return '<div data-i="'+i+'">'+esc(r.name)+' <small>'+esc([r.admin1,r.country].filter(Boolean).join(", "))+'</small></div>'; }).join("");
      s.style.display="block";
      Array.prototype.forEach.call(s.children,function(n){ n.onclick=function(){ haptic("sel"); s.style.display="none"; $("q").value=""; $("q").blur(); load(place(rs[+n.dataset.i])); }; });
    }).catch(function(){});
  },300);
});
$("q").addEventListener("keydown",function(e){ if(e.key==="Enter"){ var f=$("sugg").querySelector("[data-i]"); if(f) f.click(); } });
document.addEventListener("click",function(e){ if(!e.target.closest(".search")) $("sugg").style.display="none"; });

/* ---------- unit ---------- */
$("unit").onclick=function(){ haptic("sel"); state.unit=state.unit==="C"?"F":"C"; this.textContent="°"+state.unit; store.set("unit",state.unit);
  if(state.data) render(); if(state.view==="compare") renderCompare(); };

/* ---------- geolocation ---------- */
function reverseName(lat,lon){
  return getJSON("https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ru&zoom=10&lat="+lat+"&lon="+lon)
    .then(function(j){ var a=j.address||{}; return a.city||a.town||a.village||a.county||a.state||"Моё местоположение"; })
    .catch(function(){ return "Моё местоположение"; });
}
function gotCoords(lat,lon){ reverseName(lat,lon).then(function(n){ load({name:n, sub:"📍 Моё местоположение", lat:+lat.toFixed(3), lon:+lon.toFixed(3)}); }); }
function geoFail(msg){ haptic("err"); if(tg && tg.showAlert){ try{ tg.showAlert(msg); return; }catch(e){} } alert(msg); }
$("geo").onclick=function(){
  haptic("medium");
  var lm = tg && tg.LocationManager;
  if (lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")){
    try{
      lm.init(function(){
        if(!lm.isLocationAvailable){ browserGeo(); return; }
        lm.getLocation(function(loc){ if(loc) { skeleton(); gotCoords(loc.latitude,loc.longitude); } else { if(lm.isAccessRequested && !lm.isAccessGranted){ geoFail("Разрешите доступ к геолокации в настройках бота"); try{lm.openSettings();}catch(e){} } else browserGeo(); } });
      });
      return;
    }catch(e){}
  }
  browserGeo();
};
function browserGeo(){
  if(!navigator.geolocation){ geoFail("Геолокация недоступна"); return; }
  skeleton(); showView("weather");
  navigator.geolocation.getCurrentPosition(function(p){ gotCoords(p.coords.latitude,p.coords.longitude); },
    function(){ geoFail("Не удалось определить местоположение"); if(state.data) render(); }, {timeout:10000, maximumAge:600000});
}

/* ---------- init ---------- */
fetch("cities.json").then(function(r){ return r.json(); }).then(function(j){ state.regions=j; if(state.view==="cities") renderCities(); }).catch(function(){});
Promise.all([store.get("favs"), store.get("unit"), store.get("last")]).then(function(r){
  try{ state.favs=JSON.parse(r[0]||"[]")||[]; }catch(e){ state.favs=[]; }
  if (r[1]==="F"){ state.unit="F"; $("unit").textContent="°F"; }
  var last=null; try{ last=JSON.parse(r[2]||"null"); }catch(e){}
  var qs=new URLSearchParams(location.search).get("city");
  if (qs) loadByName(qs);
  else if (last && last.lat!=null) load(last);
  else load({name:"Москва", sub:"Россия", lat:55.756, lon:37.617});
});
})();
</script>
</body>
</html>
